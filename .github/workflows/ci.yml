name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  GO_VERSION: '1.26.1'
  NODE_VERSION: '22.22.1'
  VSCODE_COMMIT: 50f36fc4ffa240e366be854f001d3f1f7461b0bd
  ELECTRON_VERSION: 39.8.7

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: /tmp/vscode
          key: vscode-${{ env.VSCODE_COMMIT }}

      - name: Clone VS Code
        if: steps.cache-vscode.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vscode /tmp/vscode
          cd /tmp/vscode && git checkout --detach ${{ env.VSCODE_COMMIT }}

      - uses: actions/cache@v4
        with:
          path: /tmp/vscode/node_modules
          key: vscode-npm-${{ env.VSCODE_COMMIT }}

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: npm ci
        working-directory: /tmp/vscode
        run: npm ci
        env:
          npm_config_runtime: electron
          npm_config_target: ${{ env.ELECTRON_VERSION }}
          npm_config_disturl: https://artifacts.electronjs.org/headers/dist
          npm_config_build_from_source: 'true'

      - name: gulp compile-client
        working-directory: /tmp/vscode
        run: npm run gulp compile-client

      - name: Download built-in extensions
        run: bash scripts/download-extensions.sh

      - name: Build
        run: cd scripts/go-script && go run . build
        env:
          VSCODE_REPO_ROOT: /tmp/vscode

      - uses: actions/upload-artifact@v4
        with:
          name: code-server-go
          path: data/bin/code-server-go

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: code-server-go
          path: data/bin/
      - run: chmod +x data/bin/code-server-go

      - uses: actions/cache@v4
        with:
          path: /tmp/vscode
          key: vscode-${{ env.VSCODE_COMMIT }}

      - name: Download built-in extensions
        run: bash scripts/download-extensions.sh

      - name: Install Playwright
        working-directory: scripts/playwright
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('scripts/playwright/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: scripts/playwright

      - name: Run E2E
        run: cd scripts/go-script && go run . e2e
        env:
          VSCODE_REPO_ROOT: /tmp/vscode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: data/e2e/runs/

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: code-server-go
          path: data/bin/
      - run: chmod +x data/bin/code-server-go

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docker/alpine.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-server-go
      - uses: softprops/action-gh-release@v2
        with:
          files: code-server-go
          generate_release_notes: true
